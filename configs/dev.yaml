# 本地开发默认配置（Phase 1 单体）
server:
  addr: ":18080"
rule:
  default_id: "sichuan_xuezhandaodi_huansanzhang"
cluster:
  lobby_addr: ""
  room_addr: ""
redis:
  addr: ""
postgres:
  dsn: ""
obs:
  addr: ""
etcd:
  endpoints: ""
runtime:
  gate:
    ws_rate_limit_per_second: 20
    ws_rate_limit_burst: 40
    ws_idempotency_cache: 4096
  room:
    mailbox_capacity: 96
    surrender_action_timeout: 1s
    surrender_after_offline: 30s
    allow_leave_during_play: true
  lobby:
    bot_supervisor_enabled: true
    max_bots_per_room: 3
  redis:
    idempotency_ttl: 10m
  postgres:
    pool:
      max_conns: 0
      min_conns: 0
      max_conn_lifetime: 0s
      max_conn_idle_time: 0s
      health_check_period: 0s
  logging:
    level: info
    format: json
    otel_enabled: false
    otel_endpoint: ""
    dynamic_level: false
    sample:
      initial: 0
      thereafter: 0
      tick: 1s
      error_never: true
