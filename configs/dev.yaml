# 本地开发默认配置（Phase 1 单体）
server:
  addr: ":18080"
rule:
  default_id: "sichuan_xuezhandaodi_huansanzhang"
cluster:
  lobby_addr: ""
  room_addr: ""
  # 集群内 gRPC 双向 TLS：三项证书材料齐备时启用 mTLS；
  # 全空表示明文（仅限可信网络）；半配置会拒绝启动。
  tls:
    cert_file: ""
    key_file: ""
    ca_file: ""
    server_name: ""
redis:
  addr: ""
postgres:
  dsn: ""
obs:
  addr: ""
etcd:
  endpoints: ""
  prefix: "/lsp"
  # 控制面 etcd 客户端 TLS：与集群 gRPC 属不同信任域，证书材料独立配置；
  # 三态语义同 cluster.tls（齐备启用、全空明文、半配置拒绝启动）。
  tls:
    cert_file: ""
    key_file: ""
    ca_file: ""
    server_name: ""
runtime:
  gate:
    ws_rate_limit_per_second: 20
    ws_rate_limit_burst: 40
    ws_idempotency_cache: 4096
  room:
    mailbox_capacity: 96
    surrender_action_timeout: 1s
    surrender_after_offline: 30s
    allow_leave_during_play: true
  lobby:
    bot_supervisor_enabled: true
    max_bots_per_room: 3
  redis:
    idempotency_ttl: 10m
  postgres:
    pool:
      max_conns: 0
      min_conns: 0
      max_conn_lifetime: 0s
      max_conn_idle_time: 0s
      health_check_period: 0s
  logging:
    level: info
    format: json
    otel_enabled: false
    otel_endpoint: ""
    dynamic_level: false
    sample:
      initial: 0
      thereafter: 0
      tick: 1s
      error_never: true
