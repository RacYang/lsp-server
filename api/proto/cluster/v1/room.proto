syntax = "proto3";

package cluster.v1;

option go_package = "racoo.cn/lsp/api/gen/go/cluster/v1;clusterv1";

// RoomService 在房间归属节点上执行局内事件（集群内 gRPC）。
service RoomService {
  rpc ApplyEvent(ApplyEventRequest) returns (ApplyEventResponse);
  rpc StreamEvents(StreamEventsRequest) returns (stream RoomServiceStreamEventsResponse);
  // SnapshotRoom 返回当前房间可恢复摘要与快照游标，供 gate 在 StreamEvents 前对齐切点。
  rpc SnapshotRoom(SnapshotRoomRequest) returns (SnapshotRoomResponse);
}

message ApplyEventRequest {
  string room_id = 1;
  oneof body {
    ReadyEvent ready = 2;
    DiscardEvent discard = 3;
    PongEvent pong = 4;
    GangEvent gang = 5;
    HuEvent hu = 6;
    ExchangeThreeEvent exchange_three = 7;
    QueMenEvent que_men = 8;
    PassEvent pass = 11;
    LeaveEvent leave = 12;
  }
  string idempotency_key = 9;
  string user_id = 10;
}

message ApplyEventResponse {
  bool accepted = 1;
  string error = 2;
}

message LeaveEvent {}

message StreamEventsRequest {
  string room_id = 1;
  string since_cursor = 2;
}

message SnapshotRoomRequest {
  string room_id = 1;
  // user_id 用于生成仅当前连接可见的手牌快照。
  string user_id = 2;
}

// SnapshotRoomResponse.cursor 即快照游标 snapshot_cursor，与 room_events.seq 对齐。
message SnapshotRoomResponse {
  string cursor = 1;
  repeated string player_ids = 2;
  repeated int32 que_suit_by_seat = 3;
  string state = 4;
  string error = 5;
  int32 acting_seat = 6;
  string waiting_action = 7;
  string pending_tile = 8;
  repeated string available_actions = 9;
  repeated ClaimCandidate claim_candidates = 10;
  repeated string your_hand_tiles = 11;
  repeated SeatTiles discards_by_seat = 12;
  repeated SeatTiles melds_by_seat = 13;
  repeated SeatInfo seats = 14;
  LastActionInfo last_action = 15;
  int32 wall_remaining = 16;
  int64 deadline_unix_ms = 17;
  repeated SeatMelds meld_infos_by_seat = 18;
  int32 round_index = 19;
  int32 hand_index = 20;
  repeated SeatScore total_scores = 21;
  RuleMeta rule_meta = 22;
}

message SeatInfo {
  int32 seat_index = 1;
  string user_id = 2;
  string nickname = 3;
  bool is_bot = 4;
  bool surrendered = 5;
  bool online = 6;
  bool auto_play = 7;
  int64 disconnected_at_ms = 8;
  string status = 9;
  int32 total_score = 10;
}

// RoomServiceStreamEventsResponse 为房间向接入层推送的抽象事件，由 gate 映射为 client.v1 帧。
message RoomServiceStreamEventsResponse {
  string room_id = 1;
  oneof body {
    StartGameEvent start_game = 2;
    DrawTileEvent draw_tile = 3;
    ActionEvent action = 4;
    SettlementEvent settlement = 5;
    ExchangeThreeDoneEvent exchange_three_done = 6;
    QueMenDoneEvent que_men_done = 7;
    RouteRedirectEvent route_redirect = 8;
    InitialDealEvent initial_deal = 10;
  }
  string cursor = 9;
  // target_seat 为 -1 时广播；0..3 时仅发送给指定座位。
  int32 target_seat = 11;
}

message ReadyEvent {}

message DiscardEvent {
  string tile = 1;
}

message PongEvent {}

message GangEvent {
  string tile = 1;
}

message HuEvent {}

message PassEvent {}

message ExchangeThreeEvent {
  repeated string tiles = 1;
  // 1=顺时针 2=对家 3=逆时针（四家必须提交一致方向）
  int32 direction = 2;
}

message QueMenEvent {
  int32 suit = 1;
}

message StartGameEvent {
  int32 dealer_seat = 1;
}

message InitialDealEvent {
  int32 seat_index = 1;
  repeated string tiles = 2;
}

message DrawTileEvent {
  int32 seat_index = 1;
  string tile = 2;
  int32 wall_remaining = 3;
  int64 deadline_unix_ms = 4;
}

message ActionEvent {
  int32 seat_index = 1;
  string action = 2;
  string tile = 3;
  ActionDetail detail = 4;
  int32 wall_remaining = 5;
  int64 deadline_unix_ms = 6;
}

message SettlementEvent {
  repeated string winner_user_ids = 1;
  int32 total_fan = 2;
  string detail_text = 3;
  repeated SeatScore seat_scores = 4;
  repeated PenaltyItem penalties = 5;
  repeated WinnerBreakdown per_winner_breakdown = 6;
  int32 round_index = 7;
  int32 hand_index = 8;
  repeated SeatScore total_scores = 9;
}

message ExchangeThreeDoneEvent {
  repeated SeatTiles seat_tiles = 1;
}

message QueMenDoneEvent {
  repeated int32 que_suit_by_seat = 1;
}

message RouteRedirectEvent {
  // ws_url 必须是客户端可直接拨号的完整 WebSocket URL；同集群 gate 副本间不应下发。
  string ws_url = 1;
  string reason = 2;
}

message SeatTiles {
  int32 seat_index = 1;
  repeated string tiles = 2;
}

message RuleMeta {
  string rule_id = 1;
  string display_name = 2;
  string short_desc = 3;
  repeated string enabled_features = 4;
  int32 max_hands = 5;
}

message ActionDetail {
  int64 step = 1;
  int32 actor_seat = 2;
  string action = 3;
  string tile = 4;
  int32 target_seat = 5;
  int32 source_seat = 6;
  int64 created_at_ms = 7;
}

message LastActionInfo {
  int64 step = 1;
  int32 actor_seat = 2;
  string action = 3;
  string tile = 4;
  int32 target_seat = 5;
  int32 source_seat = 6;
  int64 created_at_ms = 7;
}

message MeldInfo {
  int32 seat_index = 1;
  string kind = 2;
  repeated string tiles = 3;
  int32 claimed_from_seat = 4;
  bool concealed = 5;
  int64 step = 6;
}

message SeatMelds {
  int32 seat_index = 1;
  repeated MeldInfo melds = 2;
}

message ClaimCandidate {
  int32 seat_index = 1;
  repeated string actions = 2;
}

message SeatScore {
  int32 seat_index = 1;
  string user_id = 2;
  int32 total_fan = 3;
  bool skipped = 4;
}

message PenaltyItem {
  string reason = 1;
  int32 from_seat = 2;
  int32 to_seat = 3;
  int32 amount = 4;
}

message WinnerBreakdown {
  int32 seat_index = 1;
  string user_id = 2;
  int32 fan = 3;
  repeated string fan_names = 4;
}
