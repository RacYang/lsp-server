syntax = "proto3";

package v1;

import "client/v1/messages.proto";

option go_package = "racoo.cn/lsp/api/gen/go/v1;v1";

// RoomService 在房间归属节点上执行局内事件（集群内 gRPC，非客户端直连）。
service RoomService {
  rpc ApplyEvent(ApplyEventRequest) returns (ApplyEventResponse);
  // StreamEvents 已废弃（deprecated）：实时事件路径改用 Redis List + BLPOP；
  // 本 RPC 仅保留以维持迁移期间的向后兼容，后续版本将移除。
  rpc StreamEvents(StreamEventsRequest) returns (stream RoomServiceStreamEventsResponse);
  // SnapshotRoom 返回当前房间可恢复摘要与快照游标，供 gate 在订阅前对齐切点。
  rpc SnapshotRoom(SnapshotRoomRequest) returns (SnapshotRoomResponse);
  // GetRoomEvents 返回指定游标之后的历史事件，供 gate 在重连时补齐遗漏帧。
  // 实时事件由 Redis BLPOP 获取；本接口仅用于重放历史，不阻塞等待新事件。
  rpc GetRoomEvents(GetRoomEventsRequest) returns (GetRoomEventsResponse);
}

// LobbyService 提供房间创建、加入与元数据查询（集群内 gRPC，非客户端直连接口）。
service LobbyService {
  rpc CreateRoom(CreateRoomRequest) returns (CreateRoomResponse);
  rpc JoinRoom(JoinRoomRequest) returns (JoinRoomResponse);
  rpc GetRoom(GetRoomRequest) returns (GetRoomResponse);
  rpc ListRooms(ListRoomsRequest) returns (ListRoomsResponse);
  rpc ListRules(ListRulesRequest) returns (ListRulesResponse);
  rpc AutoMatch(AutoMatchRequest) returns (AutoMatchResponse);
  rpc LeaveRoom(LeaveRoomRequest) returns (LeaveRoomResponse);
  rpc AddBot(AddBotRequest) returns (AddBotResponse);
}

// ── RoomService 请求/响应 ─────────────────────────────────────────────────

message ApplyEventRequest {
  string room_id = 1;
  reserved 7, 8;
  reserved "exchange_three", "que_men";
  oneof body {
    ReadyEvent ready = 2;
    DiscardEvent discard = 3;
    PongEvent pong = 4;
    GangEvent gang = 5;
    HuEvent hu = 6;
    PassEvent pass = 11;
    LeaveEvent leave = 12;
    JoinEvent join = 14;
    ChiEvent chi = 15;
    OpeningActionEvent opening_action = 16;
    // MarkOfflineEvent 由 gate 在连接断开时发送，room actor 内部启动投降倒计时。
    MarkOfflineEvent mark_offline = 17;
    // CancelOfflineEvent 由 gate 在玩家重连时发送，room actor 取消待触发的投降倒计时。
    CancelOfflineEvent cancel_offline = 18;
  }
  string idempotency_key = 9;
  string user_id = 10;
  // phase_token 透传客户端发起请求时的 (step, reason)，房间 actor 在入口校验。
  client.v1.PhaseToken phase_token = 13;
}

message ApplyEventResponse {
  bool accepted = 1;
  string error = 2;
  // error_code 枚举值与 client.v1.ErrorCode 保持同编号；用于回传 PHASE_DRIFTED 等。
  int32 error_code = 3;
  client.v1.PhaseUpdate phase_update = 4;
}

message LeaveEvent {}

// JoinEvent 仅让玩家占座，不标记就绪；用于远程网关在 AutoMatch/CreateRoom 时对齐本地 rooms.Join 语义。
message JoinEvent {}

message StreamEventsRequest {
  string room_id = 1;
  string since_cursor = 2;
}

// GetRoomEventsRequest 供 gate 在重连时从 room 节点拉取指定游标之后的历史事件。
message GetRoomEventsRequest {
  string room_id = 1;
  // since_cursor 格式为 "{roomID}:{seq}"，仅返回 seq 之后的事件。
  string since_cursor = 2;
}

// GetRoomEventsResponse 包含游标之后的全部历史事件；事件数量以房间完整局为上限。
message GetRoomEventsResponse {
  repeated RoomServiceStreamEventsResponse events = 1;
}

message SnapshotRoomRequest {
  string room_id = 1;
  // user_id 用于生成仅当前连接可见的手牌快照。
  string user_id = 2;
}

// SnapshotRoomResponse.cursor 即快照游标 snapshot_cursor，与 room_events.seq 对齐。
message SnapshotRoomResponse {
  string cursor = 1;
  repeated string player_ids = 2;
  repeated int32 que_suit_by_seat = 3;
  string state = 4;
  string error = 5;
  int32 acting_seat = 6;
  string waiting_action = 7;
  string pending_tile = 8;
  repeated string available_actions = 9;
  repeated client.v1.ClaimCandidate claim_candidates = 10;
  repeated string your_hand_tiles = 11;
  repeated client.v1.SeatTiles discards_by_seat = 12;
  repeated client.v1.SeatTiles melds_by_seat = 13;
  repeated client.v1.SeatInfo seats = 14;
  client.v1.LastActionInfo last_action = 15;
  int32 wall_remaining = 16;
  int64 deadline_unix_ms = 17;
  repeated client.v1.SeatMelds meld_infos_by_seat = 18;
  int32 round_index = 19;
  int32 hand_index = 20;
  repeated client.v1.SeatScore total_scores = 21;
  client.v1.RuleMeta rule_meta = 22;
  client.v1.Phase phase = 23;
  repeated int32 acting_seats = 24;
  int64 last_step = 25;
  client.v1.PhaseUpdate phase_update = 26;
}

// RoomServiceStreamEventsResponse 为房间向接入层推送的抽象事件；
// body 直接携带 client.v1 消息类型，gate 可不做转译直接封装 Envelope 下发。
message RoomServiceStreamEventsResponse {
  string room_id = 1;
  reserved 6, 7;
  reserved "exchange_three_done", "que_men_done";
  oneof body {
    client.v1.StartGameNotify start_game = 2;
    client.v1.DrawTileNotify draw_tile = 3;
    client.v1.ActionNotify action = 4;
    client.v1.SettlementNotify settlement = 5;
    client.v1.RouteRedirectNotify route_redirect = 8;
    client.v1.InitialDealNotify initial_deal = 10;
    client.v1.OpeningDoneNotify opening_done = 12;
  }
  string cursor = 9;
  // target_seat 为 -1 时广播；0..3 时仅发送给指定座位。
  int32 target_seat = 11;
}

// ── 局内指令（仅服务端使用，客户端不可见）────────────────────────────────

message ReadyEvent {}

message DiscardEvent {
  string tile = 1;
}

message PongEvent {}

message ChiEvent {
  repeated string tiles = 1;
}

message GangEvent {
  string tile = 1;
}

message HuEvent {}

message PassEvent {}

message OpeningActionEvent {
  string action = 1;
  repeated string tiles = 2;
  int32 direction = 3;
  int32 suit = 4;
  map<string, string> params = 5;
}

// MarkOfflineEvent 通知 room actor 玩家已断线，开始投降倒计时（服务端内部指令，非客户端可见）。
message MarkOfflineEvent {}

// CancelOfflineEvent 通知 room actor 玩家已重连，取消待触发的投降倒计时（服务端内部指令，非客户端可见）。
message CancelOfflineEvent {}

// ── LobbyService 请求/响应 ───────────────────────────────────────────────

message CreateRoomRequest {
  string room_id = 1;
  string rule_id = 2;
  string idempotency_key = 3;
  string display_name = 4;
  bool private = 5;
  string creator_user_id = 6;
}

message CreateRoomResponse {
  string room_id = 1;
  string room_node_id = 2;
  string error = 3;
  int32 seat_index = 4;
}

message JoinRoomRequest {
  string room_id = 1;
  string user_id = 2;
  string idempotency_key = 3;
}

message JoinRoomResponse {
  int32 seat_index = 1;
  string error = 2;
}

message LeaveRoomRequest {
  string room_id = 1;
  string user_id = 2;
}

message LeaveRoomResponse {
  string error = 1;
}

message GetRoomRequest {
  string room_id = 1;
}

message GetRoomResponse {
  string room_id = 1;
  string room_node_id = 2;
  string error = 3;
}

message ListRoomsRequest {
  int32 page_size = 1;
  string page_token = 2;
}

// ListRoomsResponse 使用 client.v1.RoomMeta，gate 可直接透传不做转译。
message ListRoomsResponse {
  repeated client.v1.RoomMeta rooms = 1;
  string next_page_token = 2;
  string error = 3;
}

message ListRulesRequest {}

// ListRulesResponse 使用 client.v1.RuleMeta，gate 可直接透传不做转译。
message ListRulesResponse {
  repeated client.v1.RuleMeta rules = 1;
  string error = 2;
}

message AutoMatchRequest {
  string rule_id = 1;
  string user_id = 2;
  bool pad_with_bots = 3;
}

message AutoMatchResponse {
  string room_id = 1;
  string room_node_id = 2;
  int32 seat_index = 3;
  string error = 4;
}

message AddBotRequest {
  string room_id = 1;
  string user_id = 2;
  int32 count = 3;
  string difficulty = 4;
  string op_id = 5;
}

// AddBotResponse 使用 client.v1.SeatInfo，gate 可直接透传不做转译。
message AddBotResponse {
  repeated client.v1.SeatInfo added = 1;
  string error = 2;
}
