stage: alpha

paths:
  generated_marker: gen
  negatives: .build/negatives

tools:
  go: 1.26.3
  golangci-lint: 2.12.2
  go-arch-lint: 1.12.0
  buf: 1.53.0
  govulncheck: 1.1.4
  gitleaks: 8.28.0
  yq: 4.45.1
  markdownlint-cli2: 0.18.1
  shellcheck: 0.10.0
  yamllint: 1.37.1
  goimports: 0.32.0
  protoc-gen-go: 1.36.10
  protoc-gen-go-grpc: 1.5.1

coverage:
  thresholds:
    internal/mahjong/analysis: 70
    internal/mahjong/wall: 65
    internal/mahjong/...: 90
    internal/domain/...: 80
    internal/app: 41
    internal/gateway/remote: 35
    internal/handler: 75
    internal/protocol: 80
    internal/service/room: 67
    internal/service/bot: 60
    internal/adapter/lobby: 55
    internal/adapter/room: 45
    internal/bot: 40
    internal/bot/advisor: 0
    internal/bot/wsclient: 0
    cmd/all: 45
    cmd/bot: 0
    cmd/gate: 45
    cmd/lobby: 55
    cmd/room: 40
    cmd/cli: 35
    default: 60
  extra_exclude:
    - "cmd/loadgen/**"

lint:
  golangci:
    enable:
      - govet
      - errcheck
      - staticcheck
      - ineffassign
      - unused
      - gosec
      - revive
      - gocritic
      - errorlint
      - bodyclose
      - noctx
      - testifylint
    settings:
      revive:
        disable_rules:
          - exported
          - package-comments
          - unused-parameter
      gosec:
        excludes:
          - G117
          - G118
    exclusions:
      rules:
        - path: internal/mahjong/wall/wall.go
          linters: [gosec]
          text: G404
        - path: _test\.go$
          linters: [gosec]
          text: G(304|204)
        - path: _test\.go$
          linters: [noctx]
  arch:
    layers:
      # 将麻将子包拆分为独立组件，避免 go-arch-lint 将子包 import 误判为跨组件依赖
      mahjong_builtin: internal/mahjong/builtin/**
      mahjong_guobiao: internal/mahjong/guobiao/jingji/**
      mahjong_xuezhandaodi: internal/mahjong/sichuan/xuezhandaodi/**
      mahjong_rules: internal/mahjong/rules/**
      mahjong_tile: internal/mahjong/tile/**
      mahjong_wall: internal/mahjong/wall/**
      mahjong_hand: internal/mahjong/hand/**
      mahjong_hu: internal/mahjong/hu/**
      mahjong_fan: internal/mahjong/fan/**
      mahjong_analysis: internal/mahjong/analysis/**
      bot: internal/bot/**
      service_bot: internal/service/bot/**
      domain: internal/domain/**
      app: internal/app/**
      adapter: internal/adapter/**
      gateway: internal/gateway/**
      protocol: internal/protocol/**
      cluster: internal/cluster/**
      handler: internal/handler/**
      store: internal/store/**
      service: internal/service/**
      session: internal/session/**
      config: internal/config/**
      clock: internal/clock/**
      metrics: internal/metrics/**
      log: internal/log/**
      cmd: cmd/**
      pkg: pkg/**
      apigen_client: api/gen/go/client/v1/**
      apigen_v1: api/gen/go/v1/**
    deny:
      - from: mahjong_builtin
        to: [protocol, cluster, handler, store, service, service_bot, session, app, adapter, gateway, clock, metrics, bot, cmd]
      - from: mahjong_xuezhandaodi
        to: [protocol, cluster, handler, store, service, service_bot, session, app, adapter, gateway, clock, metrics, bot, cmd]
      - from: mahjong_rules
        to: [protocol, cluster, handler, store, service, service_bot, session, app, adapter, gateway, clock, metrics, bot, cmd]
      - from: mahjong_tile
        to: [protocol, cluster, handler, store, service, service_bot, session, app, adapter, gateway, clock, metrics, bot, cmd]
      - from: mahjong_wall
        to: [protocol, cluster, handler, store, service, service_bot, session, app, adapter, gateway, clock, metrics, bot, cmd]
      - from: mahjong_hand
        to: [protocol, cluster, handler, store, service, service_bot, session, app, adapter, gateway, clock, metrics, bot, cmd]
      - from: mahjong_hu
        to: [protocol, cluster, handler, store, service, service_bot, session, app, adapter, gateway, clock, metrics, bot, cmd]
      - from: mahjong_fan
        to: [protocol, cluster, handler, store, service, service_bot, session, app, adapter, gateway, clock, metrics, bot, cmd]
      - from: mahjong_analysis
        to: [protocol, cluster, handler, store, service, service_bot, session, app, adapter, gateway, clock, metrics, bot, cmd]
      - from: domain
        to: [protocol, cluster, handler, store, service, service_bot, app, adapter, gateway, clock, metrics, bot, cmd]
      - from: handler
        to: [store]
      - from: adapter
        to: [app, cmd, gateway]
      - from: gateway
        to: [mahjong_builtin, mahjong_guobiao, mahjong_xuezhandaodi, mahjong_rules, mahjong_tile, mahjong_wall, mahjong_hand, mahjong_hu, mahjong_fan, mahjong_analysis, domain, bot, service, service_bot, app, adapter, cmd]
      - from: service_bot
        to: [protocol, cluster, handler, store, session, app, adapter, gateway, clock, metrics, cmd]
      - from: service
        to: [protocol, handler, cluster, bot, cmd]
      - from: pkg
        to:
          - mahjong_builtin
          - mahjong_guobiao
          - mahjong_xuezhandaodi
          - mahjong_rules
          - mahjong_tile
          - mahjong_wall
          - mahjong_hand
          - mahjong_hu
          - mahjong_fan
          - mahjong_analysis
          - bot
          - service_bot
          - domain
          - app
          - adapter
          - gateway
          - protocol
          - cluster
          - handler
          - store
          - service
          - session
          - config
          - clock
          - metrics
          - log
          - cmd
          - apigen_client
          - apigen_v1
      - from: apigen_client
        to:
          - mahjong_builtin
          - mahjong_guobiao
          - mahjong_xuezhandaodi
          - mahjong_rules
          - mahjong_tile
          - mahjong_wall
          - mahjong_hand
          - mahjong_hu
          - mahjong_fan
          - mahjong_analysis
          - bot
          - service_bot
          - domain
          - app
          - adapter
          - gateway
          - protocol
          - cluster
          - handler
          - store
          - service
          - session
          - config
          - clock
          - metrics
          - log
          - cmd
          - pkg
          - apigen_v1
      - from: apigen_v1
        to:
          - mahjong_builtin
          - mahjong_guobiao
          - mahjong_xuezhandaodi
          - mahjong_rules
          - mahjong_tile
          - mahjong_wall
          - mahjong_hand
          - mahjong_hu
          - mahjong_fan
          - mahjong_analysis
          - bot
          - service_bot
          - domain
          - app
          - adapter
          - gateway
          - protocol
          - cluster
          - handler
          - store
          - service
          - session
          - config
          - clock
          - metrics
          - log
          - cmd
          - pkg

deps:
  denylist:
    - github.com/topfreegames/pitaya
    - github.com/lonng/nano
    - github.com/name5566/leaf
    - github.com/davyxu/cellnet
    - github.com/xiaonanln/goworld
    - github.com/liangdas/mqant

mahjong:
  rules:
    id_pattern: "^[a-z][a-z0-9]*(_[a-z0-9]+){2,}$"
    forbidden_abbreviations:
      - xzdd
      - gd
      - gb
      - hsz
    allowed_ids:
      - guobiao_jingji_biaozhun
      - sichuan_xuezhandaodi_huansanzhang
      - sichuan_xuezhandaodi_biaozhun

proto:
  baseline_ref: refs/tags/proto-baseline

commit:
  conventional_types:
    - feat
    - fix
    - docs
    - refactor
    - test
    - chore
    - build
    - ci
    - perf
    - style
  scopes_required: false
  scope_pattern: "^[a-z0-9][a-z0-9/-]*$"
  summary_min_cjk_ratio: 0.20
  summary_disallow_terminal_punctuation: true

git:
  default_branch: main
  protected_branches:
    - main
  branch:
    topic_pattern: "^(feat|fix|docs|refactor|test|chore|build|ci|perf|style)/[a-z0-9][a-z0-9/-]*$"
    forbid_direct_commit_on_protected: true
    allow_detached_head: true
    allow_branches:
      - main
  protected_push:
    reject_direct_push: true
    reject_non_fast_forward: true
  merge:
    server_strategy: squash
    forbid_merge_commits_on_protected: true
  history:
    allow_force_push_on_protected: false
    prefer_force_with_lease_elsewhere: true
  tags:
    release_pattern: "^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$"
    allow_special:
      - proto-baseline
    check_pushed_tags_only: true
  trailers:
    forbidden:
      - Made-with
    generated_allowlist: []
  repo_hygiene:
    max_tracked_file_bytes: 2097152
    forbidden_basenames:
      - ".DS_Store"
      - "Thumbs.db"
    binary_blocked: true
    allow_binary_globs: []
    allow_large_file_globs: []
    workspace_space_dirs_blocked: true
    workspace_scan_excludes:
      - ".git/**"
      - "api/gen/**"
  signing:
    policy: recommended
  ci_parity:
    pre_commit_target: verify-pre-commit
    pre_push_target: verify
    ci_target: verify

language:
  docs_paths:
    - "docs/**/*.md"
    - "*.md"
    - "**/README.md"
    - ".claude/rules/*.md"
    - ".claude/commands/*.md"
    - ".codex/skills/**/*.md"
  docs_exclude:
    - ".build/negatives/**"
    - "api/gen/**"
  docs_min_cjk_ratio: 0.20

commenting:
  code_paths:
    - "**/*.go"
  code_exclude:
    - "**/gen/**"
    - ".build/negatives/**"
    - "pkg/logx/**"
  min_cjk_ratio: 0.30
  technical_keywords:
    - Goroutine
    - Channel
    - Context
    - Redis
    - PostgreSQL
    - gRPC
    - Protobuf
    - WebSocket
    - etcd
    - Prometheus
    - pprof

logging:
  facade_packages:
    - "racoo.cn/lsp/pkg/logx"
  facade_impl_paths:
    - "pkg/logx/**"
  forbidden_packages:
    - "log/slog"
    - "go.uber.org/zap"
    - "go.uber.org/zap/zapcore"
  message_min_cjk_ratio: 0.30
  required_keys:
    - trace_id
    - user_id
    - room_id
  field_naming:
    pattern: "^[a-z][a-z0-9_]*$"
    max_length: 32
  field_schema_core:
    - trace_id
    - span_id
    - user_id
    - room_id
    - rule_id
    - op
    - err
    - elapsed_ms
    - shard
    - region
  forbidden_field_keys:
    - qps
    - requests_per_second
    - mailbox_depth
    - active_connections
    - concurrent_users
  pii_redact_keys:
    - token
    - password
    - secret
    - mobile
    - email
    - ip
  forbidden_literal_keys_in_calls:
    - trace_id
    - user_id
    - room_id
  context_boundaries:
    require_with_calls_when_file_exists: true
    globs:
      - "internal/transport/grpc/**/interceptor*.go"
      - "internal/transport/ws/**/handler*.go"
      - "internal/room/**/actor*.go"
      - "cmd/**/main.go"
  sampling:
    enabled: false
    initial: 0
    thereafter: 0
    tick: 1s
    error_never_sampled: true
  dynamic_level:
    enabled: false
    http_endpoint: ""
  otel:
    enabled: false
    bridge_package: "go.opentelemetry.io/contrib/bridges/otelslog"

redis:
  key_prefix: "lsp:"
  key_constructors:
    - "internal/store/redis/keys.go"

metrics:
  name_prefix: "lsp_"
  allowed_suffixes:
    - "_seconds"
    - "_total"
    - "_bytes"
    - "_count"
    - "_ratio"
    - "_info"
    - "_depth"

release:
  cli_targets:
    - darwin/arm64
    - darwin/amd64
    - linux/amd64
    - linux/arm64
    - windows/amd64

governance:
  entry_md_max_lines: 80
  rules_max_count: 55
  commands_max_count: 28
  templates_max_count: 25
  entry_md_required_anchors:
    - "## 不可妥协纪律"
    - "## 任务路由"
    - "## 导航"

stage_gates:
  bootstrap:
    cover_strict: false
  alpha:
    cover_strict: true
  beta:
    cover_strict: true
  ga:
    cover_strict: true
