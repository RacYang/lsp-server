name: ci

# 触发器: 每次 push 与 pull_request 都跑全量 verify。
# 旧写法 `push: true / pull_request: true` 是非法的 GitHub Actions 语法,
# YAML 会把 true 解析成布尔值,导致 workflow 自始至终标 "workflow file issue"
# 而从未真正执行过任何检查。改为 push: / pull_request: (空值即 null,
# Actions 视为"该事件全量触发,不附加分支或路径过滤"),与 release.yml 风格一致。
"on":
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Signed commit trial
        continue-on-error: true
        run: bash scripts/verify-signed-commit-trial.sh
      - run: make bootstrap
      - run: make verify
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make bootstrap
      - run: RUN_INTEGRATION=1 make verify-test-integration
      - run: RUN_INTEGRATION=1 make verify-test-integration-nodocker
      - run: RUN_INTEGRATION=1 make verify-test-integration-pg
